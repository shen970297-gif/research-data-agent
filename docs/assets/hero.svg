  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <circle cx="1090" cy="35" r="205" fill="none" stroke="#5eead4" stroke-opacity="0.10" stroke-width="1"/>
  <circle cx="1090" cy="35" r="260" fill="none" stroke="#5eead4" stroke-opacity="0.07" stroke-width="1"/>
  <path d="M860 290h240M860 250h240M860 210h240M860 170h240" stroke="#a5b4fc" stroke-opacity="0.1"/>
