      <stop stop-color="#101d35"/>
      <stop offset="1" stop-color="#112f3b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#5eead4"/>
      <stop offset="1" stop-color="#93c5fd"/>
